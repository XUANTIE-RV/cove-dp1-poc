# config.toml - Cargo build configuration
#
# No default [build] target is set; `./build.sh` passes
# --target riscv64gc-unknown-none-elf explicitly for the TSM build.

[target.riscv64gc-unknown-none-elf]
linker = "riscv64-unknown-linux-gnu-gcc"
rustflags = [
    "-Ctarget-feature=+h",
    "-Clink-arg=-nostartfiles",
]
